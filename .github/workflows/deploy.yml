# Builds the client and publishes it to the `gh-pages` branch (served by
# GitHub Pages at https://<owner>.github.io/draftkit/).
#
# Uses branch-based Pages (gh-pages) rather than the "GitHub Actions" source so
# that per-PR previews (see pr-preview.yml) can be served from the same site
# under /pr-preview/. `keep_files: true` preserves those preview folders when a
# production deploy publishes to the branch root.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow the workflow to push to the gh-pages branch
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'
      - name: Install dependencies
        working-directory: ./client
        run: npm ci
      - name: Build
        working-directory: ./client
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          keep_files: true
