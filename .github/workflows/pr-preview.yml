# Builds each pull request and publishes a GitHub Pages preview under
#   https://<owner>.github.io/draftkit/pr-preview/pr-<N>/
# Previews live in a `pr-preview/` folder on the `gh-pages` branch and are
# removed automatically when the PR is closed.
name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        if: github.event.action != 'closed'
        working-directory: ./client
        run: npm ci

      - name: Build
        if: github.event.action != 'closed'
        working-directory: ./client
        env:
          BASE_PATH: /draftkit/pr-preview/pr-${{ github.event.number }}/
        run: npm run build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./client/dist
          umbrella-dir: pr-preview
